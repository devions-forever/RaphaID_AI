[theme]
base = "dark"
# Locked RaphaID clinical palette — must mirror app/components/theme.py
primaryColor = "#64ffda"
backgroundColor = "#0a0f1d"
secondaryBackgroundColor = "#111a2e"
textColor = "#e8edf3"
font = "sans serif"

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[server]
headless = true
enableCORS = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false

[runner]
magicEnabled = false
fastReruns = true
